# Render Blueprint – static site (free). Deploys the React site in /web from this branch.
# Data is pre-computed by the Python model and committed to web/public/data, so no Python runs on Render.
services:
  - type: web
    runtime: static
    name: bulwark
    branch: feature/bulwark-model-and-site
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /data/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"
