name: Refresh data and model

# Re-downloads the public data, re-runs the leak audit and the whole model, and commits the new
# website JSON. Render redeploys automatically when the branch changes.
on:
  schedule:
    - cron: "17 6 3 * *"   # 3rd of each month: the previous month is complete and FRED/Shiller have updated
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m model.run --fetch
      - name: Commit if changed
        run: |
          git config user.name "bulwark-bot"
          git config user.email "bulwark-bot@users.noreply.github.com"
          git add data web/public/data outputs
          git diff --cached --quiet || (git commit -m "data: monthly refresh" && git push)
